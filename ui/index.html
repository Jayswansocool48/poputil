<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PopUtil</title>
<link rel="icon" href="/icon.svg">
<link rel="preload" href="/fonts/inter-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/poppins-medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<!-- One stroke weight, 24px grid, drawn for PopUtil -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v9h11v-9"/><path d="M10 19v-5h4v5"/></symbol>
  <symbol id="i-apps" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><circle cx="16.75" cy="16.75" r="3.25"/></symbol>
  <symbol id="i-get" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 19.5h14"/></symbol>
  <symbol id="i-tweak" viewBox="0 0 24 24"><path d="M5 7.5h8M17 7.5h2M5 16.5h3M12 16.5h7"/><circle cx="15" cy="7.5" r="2"/><circle cx="10" cy="16.5" r="2"/></symbol>
  <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.5 5.5a4 4 0 0 0-5.2 5.1L4.5 15.4V19.5h4.1l4.8-4.8a4 4 0 0 0 5.1-5.2l-2.4 2.4-2.6-.7-.7-2.6z"/></symbol>
  <symbol id="i-broom" viewBox="0 0 24 24"><path d="M14 4.5 11 11"/><path d="M7.5 12.5h7.2l1.8 7H5.7z"/><path d="M9.5 15.5v4M12.5 15.5v4"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M4 7.5a2 2 0 0 1 2-2h3.5l2 2H18a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M9 13h6M12.5 10.5 15 13l-2.5 2.5"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6 18 18M6 18l1.4-1.4M16.6 7.4 18 6"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5.5" y="11" width="13" height="9" rx="2"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m19.5 19.5-4-4"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m7 14.5 5-5 5 5"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="m10 7 5 5-5 5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5.5 12.5 4 4 9-9"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.5 20.5 19h-17z"/><path d="M12 10v4M12 16.8v.2"/></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4.5 8.5v-3h3M16.5 5.5h3v3M19.5 15.5v3h-3M7.5 18.5h-3v-3"/><path d="M4.5 12h15"/></symbol>
  <symbol id="i-restore" viewBox="0 0 24 24"><path d="M5 8.5V4.5M5 8.5h4"/><path d="M5.6 8.4A7.5 7.5 0 1 1 4.5 12"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l.8 12h8.4L17 7"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 4.5c.6 3.8 2.7 5.9 6.5 6.5-3.8.6-5.9 2.7-6.5 6.5-.6-3.8-2.7-5.9-6.5-6.5 3.8-.6 5.9-2.7 6.5-6.5z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 4v1.5M12 18.5V20M4 12h1.5M18.5 12H20M6.3 6.3l1 1M16.7 16.7l1 1M6.3 17.7l1-1M16.7 7.3l1-1"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M18.5 14.5A7 7 0 0 1 9.5 5.5a7 7 0 1 0 9 9z"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M4.5 8 12 4.5 19.5 8v8L12 19.5 4.5 16z"/><path d="M4.5 8 12 11.5 19.5 8M12 11.5v8"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="10" height="10" rx="2"/><path d="M15.5 8.5v-2a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></symbol>
</svg>

<nav class="rail" aria-label="Sections">
  <div class="brand"><img src="/icon.svg" alt=""><b>PopUtil</b></div>
  <div class="navgroup"><span>This PC</span>
    <button class="nav" data-view="overview"><svg class="i"><use href="#i-home"/></svg><span>Overview</span></button>
    <button class="nav" data-view="apps"><svg class="i"><use href="#i-apps"/></svg><span>Apps on this PC</span><em class="badge" id="badgeApps" hidden></em></button>
  </div>
  <div class="navgroup"><span>Set up</span>
    <button class="nav" data-view="get"><svg class="i"><use href="#i-get"/></svg><span>Get apps</span><em class="badge" id="badgeGet" hidden></em></button>
    <button class="nav" data-view="tweaks"><svg class="i"><use href="#i-tweak"/></svg><span>Tweaks</span></button>
  </div>
  <div class="navgroup"><span>Keep tidy</span>
    <button class="nav" data-view="tasks"><svg class="i"><use href="#i-wrench"/></svg><span>Maintenance</span></button>
    <button class="nav" data-view="clean"><svg class="i"><use href="#i-broom"/></svg><span>Disk cleanup</span></button>
    <button class="nav" data-view="organize"><svg class="i"><use href="#i-folder"/></svg><span>Organize files</span></button>
  </div>
  <div class="grow"></div>
  <button class="activity-pill" id="activityPill" title="Show activity"><i class="dot"></i><span><small>Activity</small><b id="activityText">Nothing running</b></span></button>
  <button class="nav" id="themeBtn" title="Switch light and dark"><svg class="i"><use href="#i-moon" id="themeIcon"/></svg><span id="themeText">Dark</span></button>
  <button class="nav" id="settingsBtn"><svg class="i"><use href="#i-gear"/></svg><span>Settings</span></button>
</nav>

<main>
  <section class="view" id="v-overview" aria-label="Overview"><div class="wrap" id="overview"></div></section>
  <section class="view" id="v-apps" aria-label="Apps on this PC" hidden><div class="wrap" id="apps"></div></section>
  <section class="view" id="v-get" aria-label="Get apps" hidden><div class="wrap" id="get"></div></section>
  <section class="view" id="v-tweaks" aria-label="Tweaks" hidden><div class="wrap" id="tweaks"></div></section>
  <section class="view" id="v-tasks" aria-label="Maintenance" hidden><div class="wrap" id="tasks"></div></section>
  <section class="view" id="v-clean" aria-label="Disk cleanup" hidden><div class="wrap" id="clean"></div></section>
  <section class="view" id="v-organize" aria-label="Organize files" hidden><div class="wrap" id="organize"></div></section>

  <div class="selbar" id="selbar" role="region" aria-label="Selection"><b id="selText"></b><div class="btns" id="selBtns"></div></div>

  <div class="console" id="console">
    <header id="consoleHead" role="button" tabindex="0" aria-expanded="false" aria-controls="log">
      <b>Activity</b><span class="cur" id="consoleCur">Nothing running</span>
      <button class="btn quiet" id="logClear" type="button">Clear</button>
      <svg class="i chev"><use href="#i-chev"/></svg>
    </header>
    <div class="log" id="log" aria-live="polite"></div>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true"></aside>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true"></section>
<div class="toasts" id="toasts" aria-live="polite"></div>

<dialog class="settings" id="settings">
  <form method="dialog" id="settingsForm">
    <h3>Settings</h3>
    <label class="check" style="margin:6px 0 18px"><input type="checkbox" name="match_cosmic"><span>Match my COSMIC accent color <i id="cosmicSwatch" class="swatch"></i><small id="cosmicNote"></small></span></label>
    <p>Choose who gives advice on apps, clutter and file layouts. PopUtil only sends names, sizes, dates and locations, never what's inside your files.</p>
    <div class="radios">
      <label><input type="radio" name="ai" value="claude">Claude<small>Best advice</small></label>
      <label><input type="radio" name="ai" value="ollama">Ollama<small>Stays on this PC</small></label>
      <label><input type="radio" name="ai" value="none">Rules only<small>No AI</small></label>
    </div>
    <label class="field"><span>Anthropic API key</span><input type="password" name="anthropic_key" autocomplete="off" placeholder="sk-ant-…"></label>
    <div class="row3">
      <label class="field"><span>Ollama model</span><input name="ollama_model" placeholder="llama3.1"></label>
      <label class="field" style="grid-column: span 2"><span>Ollama address</span><input name="ollama_host" placeholder="http://localhost:11434"></label>
    </div>
    <div class="row3">
      <label class="field"><span>Ignore clutter under (MB)</span><input type="number" name="min_size" min="1"></label>
      <label class="field"><span>Big file over (MB)</span><input type="number" name="large" min="10"></label>
      <label class="field"><span>Old download after (days)</span><input type="number" name="old_days" min="1"></label>
    </div>
    <div class="actions"><button class="btn quiet" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="save">Save settings</button></div>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
